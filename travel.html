<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이번주 추천 여행지</title>
    <style>
        * { text-decoration:none; margin:0 auto; padding:0; box-sizing:border-box; }
        body { width:100%; height:100%; font-family: 'Noto Sans KR', sans-serif; text-align: center; background-color:#f5f5f5; }
        .hero {align-items: center; height:240px; padding: 100px 0; 
            background: linear-gradient(rgba(143, 195, 255, 1.0), rgba(209, 159, 255, 1.0)), url('./images/hero.jpg') no-repeat center center; 
            background-size: cover; color:#fff; text-shadow:  0 1px 3px rgba(0, 0, 0, 0.4);
            margin-bottom: 60px; }
        .container { padding: 0 60px;}
        .cardbox { display:inline-block; border-radius:20px; border:solid 1px #eee; width:30%;margin:0 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); background-color: #fff; /* 카드 배경색 추가 */ }
        .cardbox span { margin:0 0 20px;}
        .cardbox span img { border-top-left-radius: 20px; border-top-right-radius: 20px; width:100%;
            height:150px; object-fit: cover;}
        .cardbox .contents { padding: 10px 20px 0; margin:0 0 20px; text-align: left; }
        .cardbox .contents h2 { margin:0 0 10px;}
        .cardbox .contents hr { margin:20px 0; background-color:#ddd; border:0; height:1px;}
        .cardbox .contents a { font-weight: bold; color:#8c45ff; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>이번주 추천 여행지</h1>
        <p>떠나고 싶은 곳을 골라보세요</p>
    </div>
    <div class="container">
        <div class="cardbox">
            <span><img src="./images/statue01.jpg" alt=""></span>
            <div class="contents">
                <h2>제주도</h2>
                <p>푸른 바다와 한라산의 매력</p>
                <hr>
                <p><a href="">자세히 보기 →</a></p>
            </div>
        </div>
        <div class="cardbox">
            <span><img src="./images/statue02.jpg" alt=""></span>
            <div class="contents">
                <h2>부산</h2>
                <p>해운대와 활기찬 도시 여행.</p>
                <hr>
                <p><a href="#">자세히 보기 →</a></p>
            </div>
        </div>
        <div class="cardbox">
            <span><img src="./images/statue03.jpg" alt=""></span>
            <div class="contents">
                <h2>서울</h2>
                <p>전통과 현대가 공존하는 도시</p>
                <hr>
                <p><a href="#">자세히 보기 →</a></p>
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {width:400px; }
        form p label {display: inline-block; padding: 2px 0 0 24px; width:90px; text-align: right;}
        form p input {padding:10px 15px; border: solid 1px #ccc; border-radius: 20px; font-size: 1.05em;}
        form p button {padding:10px 15px; width:100%; background-color: #000; color: #fff; border: 0; border-radius: 20px; font-size: 1.05em;  text-align: center;}

    </style>
</head>
<body>
    <h1>회원 가입</h1>
    <hr>
    <form action="#" method="post">
        <p>
            <label>이름 : </label>
            <input type="text" name="username" placeholder="홍길동" />
        </p>
        <p>
            <label>아이디 : </label>
            <input type="text" name="userid" id="userid" required /> <!-- required = 필수입력 -->
        </p>
        <p>
            <label>이메일 : </label>
            <input type="email" name="email" placeholder="hong@gildong.com" /> 
        </p>
        <p>
            <label>비밀번호 : </label>
            <input type="password" name="pwd"  />
        </p>
        <hr>
        <p>
            <button type="submit">가입하기</button>
        </p>


    </form>

</body>
</html>

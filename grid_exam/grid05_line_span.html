<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문제5 · 라인 번호와 span</title>
    <style>
        body {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        margin: 28px;
        color: #12213a;
        line-height: 1.6;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p.goal {
        margin: 0 0 22px;
        color: #4b5b72;
        font-size: 14px;
      }
      .box {
        background: #e4ecfb;
        border: 1px solid #cbdcf7;
        border-radius: 6px;
        padding: 14px;
        text-align: center;
        font-weight: bold;
        color: #1b3b78;
      }
      .box.solid {
        background: #2f5de0;
        border-color: #2f5de0;
        color: #fff;
      }
      .box small {
        display: block;
        font-weight: normal;
        font-size: 11px;
        opacity: 0.85;
        margin-top: 4px;
      }

     
      .dash {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: minmax(
          72px,
          auto
        ); 
        gap: 12px;
      }

      .hero {
        grid-column: 1 / -1; 
      }
      .tall {
        grid-column: 1;
        grid-row: 2 / span 2; 
      }
      .wide {
        grid-column: 2 / span 2;
      }
    </style>
  </head>
  <body>
    <h1>문제 05 · 라인 번호와 span 으로 만드는 대시보드</h1>
    <p class="goal">
      grid-column: 1 / 3 은 3칸이 아니라 2칸입니다 — 선을 세는 연습
    </p>

    <div class="dash">
      <div class="box solid hero">
        헤드라인<small>grid-column: 1 / -1</small>
      </div>
      <div class="box tall">사이드<small>grid-row: 2 / span 2</small></div>
      <div class="box wide">차트<small>grid-column: 2 / span 2</small></div>
      <div class="box">지표<small>자동 배치</small></div>
      <div class="box">지표<small>자동 배치</small></div>
      <div class="box">지표<small>자동 배치</small></div>
      <div class="box">지표<small>자동 배치</small></div>
    </div>

</body>
</html>
